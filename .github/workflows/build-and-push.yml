name: Build and Push Docker Image

on:
  push:
    branches:
      - "**"
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: remicollet/php-src-security
    steps:
      - name: Checkout this repository
      - name: Build and push images for each directory
        run: |
          for dir in apache cli fpm zts; do
            if [ -f "$dir/Dockerfile" ]; then
              echo "Building $dir..."
              docker buildx build \
                --file "$dir/Dockerfile" \
                --platform linux/amd64,linux/arm64 \
                --push \
                --tag "${{ secrets.DOCKER_USERNAME }}/php-src-security-docker:${{ steps.get_branch.outputs.branch_name }}-$dir" \
                "$dir"
            else
              echo "Skipping $dir (no Dockerfile)"
            fi
          done
        id: upstream
        run: |
          git ls-remote https://github.com/${{ env.UPSTREAM_REPO }} ${{ steps.get_branch.outputs.branch_name }} | awk '{print $1}' > upstream_commit.txt
          echo "commit_hash=$(cat upstream_commit.txt)" >> $GITHUB_OUTPUT

      - name: Compare with last built commit
        id: compare
        run: |
          if [ -f .last_upstream_commit ]; then
            LAST_COMMIT=$(cat .last_upstream_commit)
          else
            LAST_COMMIT="none"
          fi
          UPSTREAM_COMMIT=$(cat upstream_commit.txt)
          echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT
          echo "upstream_commit=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
          if [ "$LAST_COMMIT" = "$UPSTREAM_COMMIT" ]; then
            echo "No new upstream commit. Skipping build."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "New upstream commit detected."
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if no new upstream commit (only for schedule)
        if: github.event_name == 'schedule' && steps.compare.outputs.skip_build == 'true'
        run: exit 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/php-src-security-docker:${{ steps.get_branch.outputs.branch_name }}

      - name: Save latest upstream commit hash
        if: github.event_name == 'schedule' && steps.compare.outputs.skip_build == 'false'
        run: |
          cat upstream_commit.txt > .last_upstream_commit
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .last_upstream_commit
              - name: Scan for build directories
                id: scan_dirs
                run: |
                  echo "dirs=$(ls -d apache cli fpm zts 2>/dev/null | tr '\n' ' ')" >> $GITHUB_OUTPUT
              - name: Build and push images for each directory
                uses: docker/build-push-action@v5
                with:
                  context: ${{ matrix.dir }}
                  file: ${{ matrix.dir }}/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/php-src-security-docker:${{ steps.get_branch.outputs.branch_name }}-${{ matrix.dir }}
                strategy:
                  matrix:
                    dir: ${{ fromJson(steps.scan_dirs.outputs.dirs) }}
