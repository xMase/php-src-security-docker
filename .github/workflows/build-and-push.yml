name: Build and Push Docker Image

on:
  push:
    branches:
      - "**"
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: build-and-push-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip_build: ${{ steps.compare.outputs.skip_build }}
      dirs: ${{ steps.scan_dirs.outputs.dirs }}
      commit_hash: ${{ steps.upstream.outputs.commit_hash }}
    env:
      UPSTREAM_REPO: remicollet/php-src-security
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get latest upstream commit for this branch
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          echo "Branch: $BRANCH"
          COMMIT=$(git ls-remote --heads "https://github.com/${UPSTREAM_REPO}.git" "$BRANCH" | awk '{print $1}')
          if [ -z "$COMMIT" ]; then
            echo "Upstream branch not found; using 'none'"
            COMMIT="none"
          fi
          echo "$COMMIT" > upstream_commit.txt
          echo "commit_hash=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Compare with last built commit
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          LAST_COMMIT="none"
          if [ -f .last_upstream_commit ]; then
            LAST_COMMIT=$(cat .last_upstream_commit)
          fi
          UPSTREAM_COMMIT=$(cat upstream_commit.txt)
          echo "last_commit=$LAST_COMMIT" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$UPSTREAM_COMMIT" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$LAST_COMMIT" = "$UPSTREAM_COMMIT" ]; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "No upstream changes detected; skipping build for scheduled run."
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            echo "Proceeding with build."
          fi

      - name: Scan for build directories
        id: scan_dirs
        shell: bash
        run: |
          set -euo pipefail
          DIRS_JSON=$(ls -d */ 2>/dev/null | sed 's#/##' | while read -r d; do
            if [ -f "$d/Dockerfile" ]; then printf '"%s",' "$d"; fi
          done | sed 's/,$//')
          if [ -z "$DIRS_JSON" ]; then
            DIRS_JSON="[]"
          else
            DIRS_JSON="[$DIRS_JSON]"
          fi
          echo "dirs=$DIRS_JSON" >> "$GITHUB_OUTPUT"
          echo "Found build directories: $DIRS_JSON"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip_build != 'true'
    # Native runners per platform (no QEMU emulation)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      IMAGE_REPO: ${{ secrets.DOCKER_USERNAME }}/php-src-security-docker
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.prepare.outputs.dirs) }}
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.dir }} (${{ matrix.platform }}) by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.dir }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dir }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.dir }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_REPO: ${{ secrets.DOCKER_USERNAME }}/php-src-security-docker
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.prepare.outputs.dirs) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.dir }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:${{ github.ref_name }}-${{ matrix.dir }}" \
            $(printf "${IMAGE_REPO}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${IMAGE_REPO}:${{ github.ref_name }}-${{ matrix.dir }}"

  finalize:
    needs: [prepare, merge]
    if: needs.prepare.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Save latest upstream commit hash
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ needs.prepare.outputs.commit_hash }}" > .last_upstream_commit
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .last_upstream_commit
          git commit -m "chore(ci): update last upstream commit to ${{ needs.prepare.outputs.commit_hash }}" || true
          git pull --rebase
          git push
